services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: babypark_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    environment:
      - APP_ENV=production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - babypark

  nginx:
    image: nginx:1.25-alpine
    container_name: babypark_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - app
    networks:
      - babypark

  db:
    image: mysql:8.0
    container_name: babypark_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-babypark_b2b}
      MYSQL_USER: ${DB_USERNAME:-babypark}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - babypark

  redis:
    image: redis:7-alpine
    container_name: babypark_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - babypark

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: babypark_queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - babypark

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: babypark_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: >
      sh -c "while true; do
        php artisan schedule:run --no-interaction;
        sleep 60;
      done"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - babypark

volumes:
  db_data:
  redis_data:

networks:
  babypark:
    driver: bridge
