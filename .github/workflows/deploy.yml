name: Deploy to production

on:
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Require manual dispatch from develop
        run: |
          if [ "${{ github.ref }}" != "refs/heads/develop" ]; then
            echo "::error::Production deployment is authorized only from refs/heads/develop (got ${{ github.ref }})."
            exit 1
          fi
          echo "Authorized production source: develop @ ${{ github.sha }}"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /var/www/babypark-b2b
            export DEPLOY_SHA='${{ github.sha }}'
            ./deploy.sh
