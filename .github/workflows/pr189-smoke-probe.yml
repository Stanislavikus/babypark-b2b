name: PR189 smoke access probe

on:
  push:
    branches:
      - codex/implement-magento-product-campaign
    paths:
      - .github/workflows/pr189-smoke-probe.yml

permissions:
  contents: read

concurrency:
  group: pr189-smoke-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Run real Product baseline and Safe Sync readiness on smoke
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -eu
            SMOKE=/var/www/babypark-b2b-smoke
            EXPECTED_APP_HEAD=95670c67e96081c0098b81400853061865fb9759
            WT="/tmp/b2b-pr189-smoke-$$"
            PROBE="/tmp/b2b-pr189-probe-$$.php"

            cleanup() {
              git -C "$SMOKE" worktree remove --force "$WT" >/dev/null 2>&1 || true
              rm -rf "$WT" "$PROBE" >/dev/null 2>&1 || true
            }
            trap cleanup EXIT

            test -d "$SMOKE"
            test -f "$SMOKE/.env"
            test -d "$SMOKE/vendor"
            echo "SMOKE_HOST=$(hostname)"
            echo "PRIMARY_SMOKE_HEAD=$(git -C "$SMOKE" rev-parse HEAD)"
            echo "PRIMARY_SMOKE_TREE=$(test -z "$(git -C "$SMOKE" status --porcelain)" && echo CLEAN || echo DIRTY_PRESERVED)"

            git -C "$SMOKE" fetch origin codex/implement-magento-product-campaign
            git -C "$SMOKE" cat-file -e "${EXPECTED_APP_HEAD}^{commit}"
            git -C "$SMOKE" worktree add --detach "$WT" "$EXPECTED_APP_HEAD" >/dev/null
            ln -s "$SMOKE/.env" "$WT/.env"
            rm -rf "$WT/vendor" "$WT/storage"
            cp -al "$SMOKE/vendor" "$WT/vendor"
            ln -s "$SMOKE/storage" "$WT/storage"
            mkdir -p "$WT/bootstrap/cache"

            cd "$WT"
            echo "VALIDATION_HEAD=$(git rev-parse HEAD)"
            php artisan --version

            echo '' | base64 -d > "$PROBE"

            APP_ENV=stage3e-validation VALIDATION_WT="$WT" php "$PROBE"
