name: PR189 smoke access probe

on:
  push:
    branches:
      - codex/implement-magento-product-campaign
    paths:
      - .github/workflows/pr189-smoke-probe.yml

permissions:
  contents: read

concurrency:
  group: pr189-smoke-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Run Magento V1 READ evidence harness on smoke
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          EXPECTED_APP_HEAD="${GITHUB_SHA}"
          REMOTE_EVIDENCE="/var/www/babypark-b2b-smoke/storage/app/pr189-smoke-read-evidence-${EXPECTED_APP_HEAD}.log"

          mkdir -p ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_rsa "${DEPLOY_USER}@${DEPLOY_HOST}" "EXPECTED_APP_HEAD='${EXPECTED_APP_HEAD}' bash -s" <<'REMOTE'
          set -euo pipefail
          SMOKE=/var/www/babypark-b2b-smoke
          WT="/var/www/b2b-pr189-smoke-$$"
          PROBE="/tmp/b2b-pr189-probe-$$.php"
          EVIDENCE="$SMOKE/storage/app/pr189-smoke-read-evidence-${EXPECTED_APP_HEAD}.log"

          cleanup() {
            git -C "$SMOKE" worktree remove --force "$WT" >/dev/null 2>&1 || true
            rm -rf "$WT" "$PROBE" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          test -d "$SMOKE"
          test -f "$SMOKE/.env"
          test -d "$SMOKE/vendor"

          git -C "$SMOKE" fetch origin codex/implement-magento-product-campaign
          git -C "$SMOKE" cat-file -e "${EXPECTED_APP_HEAD}^{commit}"
          git -C "$SMOKE" worktree add --detach "$WT" "$EXPECTED_APP_HEAD" >/dev/null
          ln -s "$SMOKE/.env" "$WT/.env"
          rm -rf "$WT/vendor" "$WT/storage"

          mkdir -p "$WT/vendor"
          cp -a "$SMOKE/vendor/autoload.php" "$WT/vendor/autoload.php"
          cp -a "$SMOKE/vendor/composer" "$WT/vendor/composer"

          for entry in "$SMOKE/vendor/"*; do
            base="$(basename "$entry")"
            if [ "$base" = "autoload.php" ] || [ "$base" = "composer" ]; then
              continue
            fi
            ln -s "$entry" "$WT/vendor/$base"
          done

          ln -s "$SMOKE/storage" "$WT/storage"
          mkdir -p "$WT/bootstrap/cache"

          cd "$WT"
          php artisan --version
          rm -f "$EVIDENCE"

          cat > "$PROBE" <<'PHP'
          <?php

          $wt = getenv('VALIDATION_WT');

          if (! is_string($wt) || $wt === '') {
              fwrite(STDERR, "BLOCKER VALIDATION_WT_missing\n");
              exit(1);
          }

          chdir($wt);

          require $wt.'/vendor/autoload.php';
          $app = require $wt.'/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();

          use App\Models\ConnectorAccount;
          use App\Support\Connectors\AdobePaaS\AdobePaaSConnectionCheckCapability;
          use App\Support\Connectors\AdobePaaS\AdobePaaSConnectionCheckRequestFactory;
          use App\Support\Connectors\AdobePaaS\AdobePaaSBaseUrl;
          use App\Support\Connectors\AdobePaaS\AdobePaaSDiscoveryCapability;
          use App\Support\Connectors\AdobePaaS\AdobePaaSRequestContextFactory;
          use App\Support\Connectors\AdobePaaS\AdobePaaSRequestContext;
          use App\Support\Connectors\AdobePaaS\Command\AdobeProductCommandRequestFactory;
          use App\Support\Connectors\AdobePaaS\Command\AdobeProductRemoteStateNormalizer;
          use App\Support\Connectors\AdobePaaS\AdobeStoreConfigReader;
          use App\Support\Connectors\AdobePaaS\Product\AdobeProductDocumentReader;
          use App\Support\Connectors\OAuth1\OAuth1RequestSigner;
          use App\Support\Connectors\OAuth1\OAuth1SigningContext;
          use App\Support\Connectors\Transport\ConnectorHttpTransport;
          use App\Support\Connectors\Transport\ConnectorOutboundRequest;
          use App\Support\Connectors\Transport\ConnectorTransportLimits;
          use GuzzleHttp\Psr7\Request;

          function println(string $line): void
          {
              echo $line.PHP_EOL;
          }

          /**
           * @param  array<string, mixed>|null  $searchCriteria
           */
          function buildAbsoluteUrl(AdobePaaSRequestContext $context, string $endpointPath, ?array $searchCriteria): string
          {
              $baseUrl = AdobePaaSBaseUrl::parse($context->baseUrl);
              $parsed = parse_url($baseUrl->value);
              if ($parsed === false || ! isset($parsed['scheme'], $parsed['host'])) {
                  throw new RuntimeException('BLOCKER invalid_base_url');
              }

              $path = rtrim($parsed['path'] ?? '', '/');
              $path .= '/rest/'.rawurlencode($context->storeCode).$endpointPath;
              $port = isset($parsed['port']) ? ':'.$parsed['port'] : '';
              $urlWithoutQuery = $parsed['scheme'].'://'.$parsed['host'].$port.$path;

              if ($searchCriteria === null) {
                  return $urlWithoutQuery;
              }

              $query = http_build_query(
                  ['searchCriteria' => $searchCriteria],
                  '',
                  '&',
                  PHP_QUERY_RFC3986,
              );

              return $urlWithoutQuery.'?'.$query;
          }

          /**
           * @param  array<string, mixed>|null  $searchCriteria
           */
          function signedGet(
              ConnectorHttpTransport $transport,
              OAuth1RequestSigner $signer,
              AdobePaaSRequestContext $context,
              OAuth1SigningContext $signingContext,
              string $endpointPath,
              ?array $searchCriteria,
              float $totalTimeoutSeconds = 30.0,
              int $maxResponseBodyBytes = 256000,
          ): object {
              $absoluteUrl = buildAbsoluteUrl($context, $endpointPath, $searchCriteria);
              $request = new Request('GET', $absoluteUrl);
              $authorizationHeader = $signer->sign(
                  $request->getMethod(),
                  (string) $request->getUri(),
                  null,
                  null,
                  $context->credentials,
                  $signingContext,
              );

              $outboundRequest = new ConnectorOutboundRequest(
                  $request->withHeader('Authorization', $authorizationHeader),
                  new ConnectorTransportLimits(
                      connectTimeoutSeconds: 5.0,
                      totalTimeoutSeconds: $totalTimeoutSeconds,
                      maxResponseBodyBytes: $maxResponseBodyBytes,
                  ),
              );

              return $transport->send($outboundRequest);
          }

          $account = ConnectorAccount::withoutWorkspaceScope()
              ->where('auth_profile', 'adobe_commerce_paas_oauth1_integration')
              ->where('is_enabled', true)
              ->first();

          if ($account === null) {
              println('BLOCKER connector_account_not_found');
              exit(1);
          }

          $workspaceId = (string) $account->workspace_id;
          $accountId = (string) $account->id;

          println('TARGET connector_account_id='.$accountId);
          println('TARGET workspace_id='.$workspaceId);

          $context = app(AdobePaaSRequestContextFactory::class)->create($workspaceId, $accountId);
          println('TARGET store_code='.$context->storeCode);

          $connection = app(AdobePaaSConnectionCheckCapability::class)->checkConnection($context);
          println('E0 capability=connection_check endpoint=/V1/products/attributes status='.($connection->succeeded ? 'PASS' : 'FAIL').' http='.($connection->httpStatus ?? 'null').' error='.($connection->errorCode?->value ?? 'null'));

          $params = $connection->safeMessageParameters();

          if (array_key_exists('catalog_total_count', $params) && is_int($params['catalog_total_count'])) {
              println('E0 catalog_total_count='.$params['catalog_total_count']);
          }

          $requestFactory = app(AdobePaaSConnectionCheckRequestFactory::class);
          $transport = app(ConnectorHttpTransport::class);

          $signingContext = new OAuth1SigningContext(
              bin2hex(random_bytes(16)),
              time(),
          );

          $request = $requestFactory->buildProductsSearch(
              $context,
              $signingContext,
              ['pageSize' => 2, 'currentPage' => 1],
          );

          $outboundRequest = new ConnectorOutboundRequest(
              $request,
              new ConnectorTransportLimits(
                  connectTimeoutSeconds: 5.0,
                  totalTimeoutSeconds: 30.0,
                  maxResponseBodyBytes: 256 * 1024,
              ),
          );

          try {
              $result = $transport->send($outboundRequest);
          } catch (\Throwable) {
              println('E1 capability=products_collection endpoint=/V1/products status=FAIL http=null error=transport_failure');
              exit(1);
          }

          println('E1 capability=products_collection endpoint=/V1/products http='.$result->statusCode);

          $firstSku = null;
          $productsTotalCount = null;
          $itemsCount = null;
          $shape = 'unknown';

          if ($result->statusCode === 200) {
              try {
                  $decoded = json_decode($result->body, true, 512, JSON_THROW_ON_ERROR);
              } catch (\Throwable) {
                  $decoded = null;
                  $shape = 'non_json';
              }

              if (is_array($decoded) && ! array_is_list($decoded)
                  && isset($decoded['items']) && is_array($decoded['items'])
                  && isset($decoded['search_criteria']) && is_array($decoded['search_criteria'])
                  && isset($decoded['total_count']) && is_int($decoded['total_count']) && $decoded['total_count'] >= 0) {
                  $shape = 'search_result';
                  $productsTotalCount = $decoded['total_count'];
                  $itemsCount = count($decoded['items']);

                  if ($itemsCount > 0 && is_array($decoded['items'][0])) {
                      $sku = $decoded['items'][0]['sku'] ?? null;
                      if (is_string($sku) && $sku !== '') {
                          $firstSku = $sku;
                      }
                  }
              } elseif ($shape === 'unknown') {
                  $shape = 'unexpected_json';
              }
          } else {
              $shape = 'http_'.$result->statusCode;
          }

          println('E1 shape='.$shape.' total_count='.($productsTotalCount === null ? 'null' : (string) $productsTotalCount).' items_count='.($itemsCount === null ? 'null' : (string) $itemsCount).' first_sku='.($firstSku ?? 'null'));

          if ($result->statusCode !== 200) {
              println('E1 RESULT FAIL');
              exit(1);
          }

          if ($firstSku === null) {
              println('E2 empty_catalog='.($productsTotalCount === 0 ? 'PASS' : 'INCONCLUSIVE'));
          } else {
              println('E2 empty_catalog=SKIPPED');
          }

          if ($firstSku !== null) {
              try {
                  $doc = app(AdobeProductDocumentReader::class)->read($workspaceId, $accountId, $firstSku);
              } catch (\Throwable) {
                  println('E3 capability=product_get endpoint=/V1/products/{sku} status=FAIL sku='.$firstSku);
                  exit(1);
              }

              $payload = $doc->originalPayload;
              $customAttributes = $payload['custom_attributes'] ?? null;
              $extensionAttributes = $payload['extension_attributes'] ?? null;
              $productLinks = $payload['product_links'] ?? null;
              $mediaGallery = $payload['media_gallery_entries'] ?? null;
              $tierPrices = $payload['tier_prices'] ?? null;

              println('E3 capability=product_get endpoint=/V1/products/{sku} status=PASS sku='.$doc->sku.' id='.$doc->logicalEntityId.' type_id='.$doc->typeId);
              println('E3 keys custom_attributes='.((is_array($customAttributes) && array_is_list($customAttributes)) ? (string) count($customAttributes) : 'null'));
              println('E3 keys extension_attributes='.(is_array($extensionAttributes) ? 'present' : 'null'));
              println('E3 keys product_links='.((is_array($productLinks) && array_is_list($productLinks)) ? (string) count($productLinks) : 'null'));
              println('E3 keys media_gallery_entries='.((is_array($mediaGallery) && array_is_list($mediaGallery)) ? (string) count($mediaGallery) : 'null'));
              println('E3 keys tier_prices='.((is_array($tierPrices) && array_is_list($tierPrices)) ? (string) count($tierPrices) : 'null'));

              $stockItem = null;
              $quantityAndStockStatus = null;

              if (is_array($extensionAttributes)) {
                  $stockItem = $extensionAttributes['stock_item'] ?? null;
                  $quantityAndStockStatus = $extensionAttributes['quantity_and_stock_status'] ?? null;
              }

              $price = $payload['price'] ?? null;
              println('E8 capability=pricing_inventory_surfaces seam=product_payload status=PASS price='.(is_numeric($price) ? (string) $price : 'null').' stock_item='.(is_array($stockItem) ? 'present' : 'null').' quantity_and_stock_status='.(is_array($quantityAndStockStatus) ? 'present' : 'null'));

              $commandFactory = app(AdobeProductCommandRequestFactory::class);
              $mediaEntryId = null;

              if (is_array($mediaGallery) && array_is_list($mediaGallery) && isset($mediaGallery[0]) && is_array($mediaGallery[0])) {
                  $candidateId = $mediaGallery[0]['id'] ?? null;
                  if (is_int($candidateId)) {
                      $mediaEntryId = $candidateId;
                  } elseif (is_numeric($candidateId)) {
                      $mediaEntryId = (int) $candidateId;
                  }
              }

              if ($mediaEntryId === null) {
                  println('E6 capability=product_media_entry_get endpoint=/V1/products/{sku}/media/{id} status=SKIPPED reason=no_media_entry');
              } else {
                  $mediaRequest = $commandFactory->buildGetMediaEntry(
                      $context,
                      $firstSku,
                      $mediaEntryId,
                      new OAuth1SigningContext(bin2hex(random_bytes(16)), time()),
                  );

                  $mediaOutbound = new ConnectorOutboundRequest(
                      $mediaRequest,
                      new ConnectorTransportLimits(
                          connectTimeoutSeconds: 5.0,
                          totalTimeoutSeconds: 30.0,
                          maxResponseBodyBytes: 256 * 1024,
                      ),
                  );

                  try {
                      $mediaResult = $transport->send($mediaOutbound);
                  } catch (\Throwable) {
                      println('E6 capability=product_media_entry_get endpoint=/V1/products/{sku}/media/{id} status=FAIL http=null sku='.$firstSku.' entry_id='.$mediaEntryId);
                      exit(1);
                  }

                  println('E6 capability=product_media_entry_get endpoint=/V1/products/{sku}/media/{id} status='.($mediaResult->statusCode === 200 ? 'PASS' : 'FAIL').' http='.$mediaResult->statusCode.' sku='.$firstSku.' entry_id='.$mediaEntryId);

                  if ($mediaResult->statusCode !== 200) {
                      exit(1);
                  }
              }

              if ($doc->typeId === 'configurable') {
                  $childrenRequest = $commandFactory->buildGetConfigurableChildren(
                      $context,
                      $firstSku,
                      new OAuth1SigningContext(bin2hex(random_bytes(16)), time()),
                  );

                  $childrenOutbound = new ConnectorOutboundRequest(
                      $childrenRequest,
                      new ConnectorTransportLimits(
                          connectTimeoutSeconds: 5.0,
                          totalTimeoutSeconds: 30.0,
                          maxResponseBodyBytes: 512 * 1024,
                      ),
                  );

                  try {
                      $childrenResult = $transport->send($childrenOutbound);
                  } catch (\Throwable) {
                      println('E7 capability=configurable_children_get endpoint=/V1/configurable-products/{sku}/children status=FAIL http=null sku='.$firstSku);
                      exit(1);
                  }

                  println('E7 capability=configurable_children_get endpoint=/V1/configurable-products/{sku}/children status='.($childrenResult->statusCode === 200 ? 'PASS' : 'FAIL').' http='.$childrenResult->statusCode.' sku='.$firstSku);

                  if ($childrenResult->statusCode !== 200) {
                      exit(1);
                  }

                  $optionsRequest = $commandFactory->buildGetConfigurableOptions(
                      $context,
                      $firstSku,
                      new OAuth1SigningContext(bin2hex(random_bytes(16)), time()),
                  );

                  $optionsOutbound = new ConnectorOutboundRequest(
                      $optionsRequest,
                      new ConnectorTransportLimits(
                          connectTimeoutSeconds: 5.0,
                          totalTimeoutSeconds: 30.0,
                          maxResponseBodyBytes: 512 * 1024,
                      ),
                  );

                  try {
                      $optionsResult = $transport->send($optionsOutbound);
                  } catch (\Throwable) {
                      println('E7 capability=configurable_options_get endpoint=/V1/configurable-products/{sku}/options/all status=FAIL http=null sku='.$firstSku);
                      exit(1);
                  }

                  println('E7 capability=configurable_options_get endpoint=/V1/configurable-products/{sku}/options/all status='.($optionsResult->statusCode === 200 ? 'PASS' : 'FAIL').' http='.$optionsResult->statusCode.' sku='.$firstSku);

                  if ($optionsResult->statusCode !== 200) {
                      exit(1);
                  }
              } else {
                  println('E7 capability=configurable_children_get endpoint=/V1/configurable-products/{sku}/children status=SKIPPED reason=not_configurable sku='.$firstSku);
                  println('E7 capability=configurable_options_get endpoint=/V1/configurable-products/{sku}/options/all status=SKIPPED reason=not_configurable sku='.$firstSku);
              }

              $signer = app(OAuth1RequestSigner::class);

              try {
                  $stockResult = signedGet(
                      $transport,
                      $signer,
                      $context,
                      new OAuth1SigningContext(bin2hex(random_bytes(16)), time()),
                      '/V1/stockItems/'.rawurlencode($firstSku),
                      null,
                      totalTimeoutSeconds: 30.0,
                      maxResponseBodyBytes: 256 * 1024,
                  );
              } catch (\Throwable) {
                  println('E8 capability=inventory_stock_item_get endpoint=/V1/stockItems/{sku} status=FAIL http=null sku='.$firstSku);
                  exit(1);
              }

              println('E8 capability=inventory_stock_item_get endpoint=/V1/stockItems/{sku} status='.($stockResult->statusCode === 200 ? 'PASS' : 'INCONCLUSIVE').' http='.$stockResult->statusCode.' sku='.$firstSku);

              try {
                  $msiResult = signedGet(
                      $transport,
                      $signer,
                      $context,
                      new OAuth1SigningContext(bin2hex(random_bytes(16)), time()),
                      '/V1/inventory/source-items',
                      [
                          'pageSize' => 1,
                          'currentPage' => 1,
                          'filterGroups' => [
                              [
                                  'filters' => [
                                      [
                                          'field' => 'sku',
                                          'value' => $firstSku,
                                          'conditionType' => 'eq',
                                      ],
                                  ],
                              ],
                          ],
                      ],
                      totalTimeoutSeconds: 30.0,
                      maxResponseBodyBytes: 512 * 1024,
                  );
              } catch (\Throwable) {
                  println('E8 capability=inventory_source_items_get endpoint=/V1/inventory/source-items status=FAIL http=null sku='.$firstSku);
                  exit(1);
              }

              println('E8 capability=inventory_source_items_get endpoint=/V1/inventory/source-items status='.($msiResult->statusCode === 200 ? 'PASS' : 'INCONCLUSIVE').' http='.$msiResult->statusCode.' sku='.$firstSku);

              $normalizer = app(AdobeProductRemoteStateNormalizer::class);
              $observed = $normalizer->normalize($payload, $firstSku);

              if ($observed === null) {
                  println('E9 capability=normalize_product_observed_state seam=remote_state_normalizer status=FAIL sku='.$firstSku);
                  exit(1);
              }

              println('E9 capability=normalize_product_observed_state seam=remote_state_normalizer status=PASS sku='.$firstSku.' custom_attributes='.count($observed->customAttributes));
          }

          $discovery = app(AdobePaaSDiscoveryCapability::class)->discover($context, '/V1/products/attributes');

          if (! $discovery->succeeded) {
              println('E4 capability=attributes_discovery endpoint=/V1/products/attributes status=FAIL http='.($discovery->httpStatus ?? 'null').' error='.($discovery->errorCode?->value ?? 'null'));
              exit(1);
          }

          $candidate = $discovery->snapshotCandidate;
          $fieldsNormalized = $candidate?->fieldsNormalized();
          $fieldsReceived = $candidate?->fieldsReceived();
          println('E4 capability=attributes_discovery endpoint=/V1/products/attributes status=PASS fields_normalized='.($fieldsNormalized === null ? 'null' : (string) $fieldsNormalized).' fields_received='.($fieldsReceived === null ? 'null' : (string) $fieldsReceived));

          try {
              $baseCurrency = app(AdobeStoreConfigReader::class)->readBaseCurrency($workspaceId, $accountId);
          } catch (\Throwable) {
              println('E5 capability=store_config endpoint=/V1/store/storeConfigs status=FAIL');
              exit(1);
          }

          println('E5 capability=store_config endpoint=/V1/store/storeConfigs status=PASS base_currency='.$baseCurrency);

          $signer = app(OAuth1RequestSigner::class);

          try {
              $websites = signedGet(
                  $transport,
                  $signer,
                  $context,
                  new OAuth1SigningContext(bin2hex(random_bytes(16)), time()),
                  '/V1/store/websites',
                  null,
              );
          } catch (\Throwable) {
              println('E5 capability=store_websites endpoint=/V1/store/websites status=FAIL http=null');
              exit(1);
          }

          println('E5 capability=store_websites endpoint=/V1/store/websites status='.($websites->statusCode === 200 ? 'PASS' : 'FAIL').' http='.$websites->statusCode);

          if ($websites->statusCode !== 200) {
              exit(1);
          }

          try {
              $storeViews = signedGet(
                  $transport,
                  $signer,
                  $context,
                  new OAuth1SigningContext(bin2hex(random_bytes(16)), time()),
                  '/V1/store/storeViews',
                  null,
              );
          } catch (\Throwable) {
              println('E5 capability=store_storeViews endpoint=/V1/store/storeViews status=FAIL http=null');
              exit(1);
          }

          println('E5 capability=store_storeViews endpoint=/V1/store/storeViews status='.($storeViews->statusCode === 200 ? 'PASS' : 'FAIL').' http='.$storeViews->statusCode);

          if ($storeViews->statusCode !== 200) {
              exit(1);
          }

          println('DONE');
          PHP

          APP_ENV=stage3e-validation VALIDATION_WT="$WT" php "$PROBE" | tee "$EVIDENCE"
          REMOTE

          mkdir -p evidence
          scp -i ~/.ssh/id_rsa "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_EVIDENCE}" "evidence/pr189-smoke-read-evidence-${EXPECTED_APP_HEAD}.log"

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr189-smoke-read-evidence
          path: evidence/**
