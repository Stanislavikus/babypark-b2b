name: Temporary Receive docs line-wrap fix

on:
  push:
    branches:
      - chatgpt/connector-delivery-protocol
    paths:
      - .github/workflows/temp-fix-receive-doc-wrap.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/connector-delivery-protocol
          fetch-depth: 0

      - name: Apply exact documentation-only fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/03-DOMAIN_MODEL.md')
          text = path.read_text(encoding='utf-8')

          old_1 = (
              'The current Stage 3-0 merchant consequential Live admission gate list is the\n'
              'first Products/Export gate list. It is **not** a proof that every future Live\n'
          )
          new_1 = (
              'The current Stage 3-0 merchant consequential Live admission gate list is\n'
              'the first Products/Export gate list. It is **not** a proof that every future Live\n'
          )

          old_2 = (
              '- a trusted `ProductVariant` may remain the remote correlation target, but its\n'
              '  owning `Product` is the business record and local mutation owner;\n'
          )
          new_2 = (
              '- a trusted `ProductVariant` may remain the remote correlation target, but\n'
              '  its owning `Product` is the business record and local mutation owner;\n'
          )

          assert text.count(old_1) == 1, 'Expected first Receive contract line-wrap exactly once'
          assert text.count(old_2) == 1, 'Expected second Receive contract line-wrap exactly once'

          updated = text.replace(old_1, new_1).replace(old_2, new_2)
          assert updated != text
          path.write_text(updated, encoding='utf-8')
          PY

          rm .github/workflows/temp-fix-receive-doc-wrap.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/03-DOMAIN_MODEL.md .github/workflows/temp-fix-receive-doc-wrap.yml
          git diff --cached --check

          test "$(git diff --cached --numstat -- docs/03-DOMAIN_MODEL.md | awk '{print $1 ":" $2}')" = "2:2"

          git commit -m "docs(sync): align Receive contract line wrapping"
          git push origin HEAD:chatgpt/connector-delivery-protocol
